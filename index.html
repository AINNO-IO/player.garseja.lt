<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garsėja — Article audio player (Demo)</title>
    <meta
      name="description"
      content="Multilingual demo of the Garsėja article audio player for publishers. Choose your language to preview the player."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://player.garseja.lt/" />
    <link rel="alternate" hreflang="en" href="https://player.garseja.lt/en/" />
    <link rel="alternate" hreflang="lt" href="https://player.garseja.lt/lt/" />
    <link rel="alternate" hreflang="cs" href="https://player.garseja.lt/cs/" />
    <link rel="alternate" hreflang="sk" href="https://player.garseja.lt/sk/" />
    <link rel="alternate" hreflang="hu" href="https://player.garseja.lt/hu/" />
    <link rel="alternate" hreflang="ro" href="https://player.garseja.lt/ro/" />
    <link rel="alternate" hreflang="bg" href="https://player.garseja.lt/bg/" />
    <link rel="alternate" hreflang="hr" href="https://player.garseja.lt/hr/" />
    <link rel="alternate" hreflang="sr" href="https://player.garseja.lt/sr/" />
    <link rel="alternate" hreflang="sl" href="https://player.garseja.lt/sl/" />
    <link rel="alternate" hreflang="de" href="https://player.garseja.lt/de/" />
    <link rel="alternate" hreflang="es" href="https://player.garseja.lt/es/" />
    <link rel="alternate" hreflang="da" href="https://player.garseja.lt/da/" />
    <link rel="alternate" hreflang="sv" href="https://player.garseja.lt/sv/" />
    <link rel="alternate" hreflang="no" href="https://player.garseja.lt/no/" />
    <link rel="alternate" hreflang="fi" href="https://player.garseja.lt/fi/" />
    <link rel="alternate" hreflang="x-default" href="https://player.garseja.lt/en/" />
    <link rel="icon" href="./favicon.ico" type="image/x-icon" sizes="32x32" />
    <meta name="theme-color" content="#fffbf7" />

    <script>
      ;(() => {
        const supported = [
          'en',
          'lt',
          'cs',
          'sk',
          'hu',
          'ro',
          'bg',
          'hr',
          'sr',
          'sl',
          'de',
          'es',
          'da',
          'sv',
          'no',
          'fi',
        ]
        const fallback = 'en'

        const langs = (navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language]
        )
          .filter(Boolean)
          .map((l) => String(l).toLowerCase())

        const normalized = langs
          .map((l) => l.split('-')[0])
          .filter((l) => supported.includes(l))

        const best = normalized[0] || fallback
        // Redirect from `/` to `/<locale>/` for GitHub Pages-safe routing.
        window.location.replace(`./${best}/`)
      })()
    </script>
  </head>
  <body>
    <noscript>This demo requires JavaScript to redirect to the correct language.</noscript>
  </body>
</html>
