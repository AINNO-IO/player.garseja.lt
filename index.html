<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garsio — Article audio player</title>
    <meta
      name="description"
      content="Multilingual demo of the Garsio article audio player for publishers. Choose your language to preview the player."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://player.garsio.io/" />
    <link rel="alternate" hreflang="en" href="https://player.garsio.io/en/" />
    <link rel="alternate" hreflang="lt" href="https://player.garsio.io/lt/" />
    <link rel="alternate" hreflang="cs" href="https://player.garsio.io/cs/" />
    <link rel="alternate" hreflang="sk" href="https://player.garsio.io/sk/" />
    <link rel="alternate" hreflang="hu" href="https://player.garsio.io/hu/" />
    <link rel="alternate" hreflang="ro" href="https://player.garsio.io/ro/" />
    <link rel="alternate" hreflang="bg" href="https://player.garsio.io/bg/" />
    <link rel="alternate" hreflang="hr" href="https://player.garsio.io/hr/" />
    <link rel="alternate" hreflang="sr" href="https://player.garsio.io/sr/" />
    <link rel="alternate" hreflang="sl" href="https://player.garsio.io/sl/" />
    <link rel="alternate" hreflang="de" href="https://player.garsio.io/de/" />
    <link rel="alternate" hreflang="es" href="https://player.garsio.io/es/" />
    <link rel="alternate" hreflang="da" href="https://player.garsio.io/da/" />
    <link rel="alternate" hreflang="sv" href="https://player.garsio.io/sv/" />
    <link rel="alternate" hreflang="no" href="https://player.garsio.io/no/" />
    <link rel="alternate" hreflang="fi" href="https://player.garsio.io/fi/" />
    <link rel="alternate" hreflang="x-default" href="https://player.garsio.io/en/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" type="image/x-icon" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="./favicon-48.png" />
    <meta name="theme-color" content="#fffbf7" />

    <script>
      ;(() => {
        const supported = [
          'en',
          'lt',
          'cs',
          'sk',
          'hu',
          'ro',
          'bg',
          'hr',
          'sr',
          'sl',
          'de',
          'es',
          'da',
          'sv',
          'no',
          'fi',
        ]
        const fallback = 'en'

        const langs = (navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language]
        )
          .filter(Boolean)
          .map((l) => String(l).toLowerCase())

        const normalized = langs
          .map((l) => l.split('-')[0])
          .filter((l) => supported.includes(l))

        const best = normalized[0] || fallback
        // Redirect from `/` to `/<locale>/` for GitHub Pages-safe routing.
        window.location.replace(`./${best}/`)
      })()
    </script>
  </head>
  <body>
    <noscript>This demo requires JavaScript to redirect to the correct language.</noscript>
  </body>
</html>
